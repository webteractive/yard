[workspace]
resolver = "3"
members = ["crates/*"]
# Yard.app is its own workspace, on its own toolchain (app/Cargo.toml).
exclude = ["app"]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.92"
publish = false
license = "MIT"

[workspace.dependencies]
yard-proto = { path = "crates/yard-proto" }
yard-core = { path = "crates/yard-core" }
yard-client = { path = "crates/yard-client" }
yard-daemon = { path = "crates/yard-daemon" }
yard-helper = { path = "crates/yard-helper" }
