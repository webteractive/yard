[package]
name = "yard-app"
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "yard-app"
path = "src/main.rs"

[features]
# For CI runners without Xcode's Metal compiler: compile GPUI's shaders at run time.
runtime-shaders = ["gpui_platform/runtime_shaders"]

[dependencies]
futures.workspace = true
libc = "0.2.191"
gpui.workspace = true
gpui_platform.workspace = true
muda.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tray-icon.workspace = true
unicode-segmentation = "1.13.3"
yard-app-model.workspace = true
yard-client.workspace = true
yard-core.workspace = true
yard-proto.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3.27.0"
