[package]
name = "yard-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "../yard-cli/build.rs"

[dependencies]
libc = "0.2.191"
notify-debouncer-mini = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = "0.6.5"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time", "sync", "signal", "fs"] }
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
yard-core.workspace = true
yard-proto.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
yard-helper.workspace = true
