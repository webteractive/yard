[package]
name = "yard-daemon"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "../yard-cli/build.rs"

[dependencies]
libc = "0.2.191"
notify-debouncer-mini = "0.7.0"
rcgen = { version = "0.14.10", features = ["x509-parser"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
socket2 = "0.6.5"
time = "0.3.55"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time", "sync", "signal", "fs"] }
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
x509-parser = { version = "0.18.1", features = ["verify"] }
yard-core.workspace = true
yard-proto.workspace = true

[dev-dependencies]
yard-client.workspace = true
tempfile = "3.27.0"
yard-helper.workspace = true
