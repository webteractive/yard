[package]
name = "yard-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "yard"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt", "macros", "net", "io-util", "time"] }
yard-core.workspace = true
yard-daemon.workspace = true
yard-helper.workspace = true
yard-proto.workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
libc = "0.2.191"
serde_json = "1.0.154"
tempfile = "3.27.0"
