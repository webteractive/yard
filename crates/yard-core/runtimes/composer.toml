# Composer, downloaded from getcomposer.org and run under each project's PHP (runtimes spec §9).
schema = 1
key = "composer"
name = "Composer"
description = "PHP's dependency manager, per project"
runs_on = "php"
wake = true
uses_when = ["composer.json"]

# No default here: yard.toml holds the exact version unpinned projects run, and a project
# whose PHP is below 7.2.5 carries its own 2.2 pin (explicit-defaults spec §2.1).

[[requires]]
from = "2.3.0"
php = "7.2.5"

# Yard never installs these, whoever asks: a cloned project's pin can name any exact version.
# CVE-2024-35241 and CVE-2024-35242 (command injection through the git and hg drivers, even
# with --no-scripts) are fixed in 2.2.24 and 2.7.7.
[[insecure]]
below = "2.2.24"
advisory = "CVE-2024-35241, CVE-2024-35242"

[[insecure]]
from = "2.3.0"
below = "2.7.7"
advisory = "CVE-2024-35241, CVE-2024-35242"

[shims.composer]
exec = ["{php}", "{home}/composer.phar"]
refuse = [{ args = ["self-update"], hint = "yard runtime install composer <version>" },
          { args = ["selfupdate"], hint = "yard runtime install composer <version>" }]

[source]
kind = "download"
url = "https://getcomposer.org/download/{version}/composer.phar"
file = "composer.phar"

[source.index]
kind = "composer"
url = "https://getcomposer.org/versions"
sha256_url = "https://getcomposer.org/download/{version}/composer.phar.sha256sum"

[versions."2.2.32"]                 # the 2.2 LTS, pinned: used if the index stops listing 2.2
sha256 = "241a3d13b7c6d35d970b1f69a000298b66943541302148a438a932f5dd44a9fc"
