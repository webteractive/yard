[package]
name = "yard-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
plist = "1.10.1"
# Pinned as yard-cli pins it: present::state_text parses RFC 3339 times.
time = { version = "0.3.55", features = ["parsing", "formatting", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.1.8"
toml_edit = "0.25.17"
yard-proto.workspace = true

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"
